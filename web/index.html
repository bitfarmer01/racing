<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Racing — browser shell</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: #101014;
      color: #d8d8de;
      font-family: system-ui, sans-serif;
    }
    /* Full-window stage; the loader sizes the canvas backing store from
       window size x devicePixelRatio (capped) — the CSS here stays fluid. */
    #stage { position: fixed; inset: 0; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
    /* Overlay covers the stage until the game boots; then it is removed. */
    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      background: rgba(8, 8, 12, 0.82);
      padding: 1rem;
    }
    #overlay.error { color: #ff8383; }
    /* HUD: translucent dark strip with bright figures, readable over the
       pale sky (playtest E1). */
    #hud:not([hidden]) {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 16px;
      background: rgba(8, 10, 14, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      color: #f2f4f8;
      pointer-events: none;
    }
    #hud-speed {
      font: 700 30px/1 ui-monospace, monospace;
      color: #ffffff;
    }
    #hud-speed .unit {
      font-size: 13px;
      font-weight: 400;
      color: #aeb6c2;
      margin-left: 4px;
    }
    #hud-lines {
      font: 13px/1.55 ui-monospace, monospace;
      color: #d5dae2;
    }
    #lap-bar {
      width: 180px;
      height: 4px;
      margin-top: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }
    #lap-fill {
      width: 0%;
      height: 100%;
      background: #4ade80;
      border-radius: 2px;
    }
    /* Rider-state badge, top-right (playtest E5). */
    #rider-state:not([hidden]) {
      position: absolute;
      top: 12px;
      right: 12px;
      font: 700 14px system-ui, sans-serif;
      letter-spacing: 0.08em;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 999px;
      pointer-events: none;
    }
    #rider-state.crashed { background: #c62828; }
    #rider-state.offroad { background: #b45309; }
    #rider-state.braking { background: #1d4ed8; }
    #rider-state.grid {
      background: rgba(8, 10, 14, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffd75e;
    }
    /* Author display rules must not defeat the hidden attribute's UA
       display:none — scope them to :not([hidden]) so overlays actually
       disappear when hidden is set. */
    #countdown:not([hidden]) {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font: 700 84px ui-monospace, monospace;
      color: #ffd75e;
      text-shadow: 0 2px 12px #000;
      pointer-events: none;
    }
    #finish:not([hidden]) {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      background: rgba(8, 8, 12, 0.72);
    }
    #finish h1 {
      margin: 0 0 0.5rem;
      font-size: 1.6rem;
      color: #ffd75e;
    }
    #finish p {
      margin: 0 0 1rem;
      color: #c9cdd4;
    }
    #restart {
      font: 600 1rem system-ui, sans-serif;
      padding: 0.5rem 1.4rem;
      border-radius: 6px;
      border: 1px solid #4a4a56;
      background: #26262e;
      color: #f0f0f4;
      cursor: pointer;
    }
    #restart:hover { background: #33333e; }
    #keys {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #84848e;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay"><div>
      <div id="status">Loading…</div>
      <div id="keys">Arrows / WASD to ride — Down / S to brake</div>
    </div></div>
    <div id="hud" hidden>
      <div id="hud-speed"><span id="speed-value">0</span><span class="unit">km/h</span></div>
      <div id="hud-lines">
        <div id="hud-pos"></div>
        <div id="hud-lap"></div>
        <div id="lap-bar"><div id="lap-fill"></div></div>
      </div>
    </div>
    <div id="rider-state" hidden></div>
    <div id="countdown" hidden></div>
    <div id="finish" hidden>
      <div>
        <h1>Finish!</h1>
        <p id="finish-text"></p>
        <button id="restart" type="button">Race again</button>
      </div>
    </div>
  </div>
  <script type="module" src="loader.js"></script>
</body>
</html>
