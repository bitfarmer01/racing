<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Racing — browser shell</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101014;
      color: #d8d8de;
      font-family: system-ui, sans-serif;
    }
    #stage { position: relative; }
    canvas {
      display: block;
      width: 800px;
      height: 450px;
      max-width: 96vw;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid #2a2a32;
      border-radius: 6px;
    }
    /* Overlay covers the canvas until the game boots; then it is removed. */
    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      background: rgba(8, 8, 12, 0.82);
      border-radius: 6px;
      padding: 1rem;
    }
    #overlay.error { color: #ff8383; }
    #hud {
      position: absolute;
      top: 8px;
      left: 12px;
      font: 12px/1.6 ui-monospace, monospace;
      color: #9aa0a8;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
      white-space: pre-line;
    }
    #keys {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #84848e;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="overlay"><div>
      <div id="status">Loading…</div>
      <div id="keys">Arrows / WASD to ride — Down / S to brake</div>
    </div></div>
    <div id="hud" hidden></div>
  </div>
  <script type="module" src="loader.js"></script>
</body>
</html>
