[package]
name = "render"
version.workspace = true
edition.workspace = true
description = "wgpu 3D renderer: terrain, road, props, bikes, sky, shadows, HDR bloom"

[dependencies]
game = { path = "../game" }
glam.workspace = true
bytemuck.workspace = true
# `default-features = false` keeps wgpu's `webgpu` feature out of the graph:
# cargo unifies features per target, so a default-features wgpu would
# re-enable browser WebGPU inside the WebGL2 bundle, where it races the GL
# binding for the canvas. The web crate adds the one browser backend it ships.
wgpu = { version = "25.0.0", default-features = false, features = [
    "wgsl",
    "gles",
    "vulkan",
    "metal",
    "dx12",
] }
