[package]
name = "assets"
version = "0.1.0"
edition = "2021"
description = "Sprite atlas packer: PNG sprites in, one packed atlas PNG plus an index JSON out."

[lib]
name = "assets"
path = "src/lib.rs"

[[bin]]
name = "assets-pack"
path = "src/bin/assets-pack.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
