[package]
name = "web"
version.workspace = true
edition.workspace = true
description = "Browser shell: wasm-bindgen entry points that drive a race session and draw it to a canvas."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgpu"]
# One wasm bundle per GPU backend; web/loader.js picks one at load time.
webgpu = ["wgpu/webgpu"]
webgl2 = ["wgpu/webgl"]

[dependencies]
game = { path = "../game" }
render = { path = "../render" }
runtime = { path = "../runtime" }
glam.workspace = true
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { version = "25", default-features = false, features = ["wgsl"] }
