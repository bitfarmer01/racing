[package]
name = "web"
version.workspace = true
edition.workspace = true
description = "WASM browser shell: wasm-bindgen entrypoints composing runtime frames into the render GPU path on a canvas."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgpu"]
# The backends are cargo-feature builds: exactly one ships per wasm artifact
# and the JS loader picks between them at load time (see web/build.sh). The
# chosen build reports its backend through `backend_name`.
webgpu = ["wgpu/webgpu"]
webgl2 = ["wgpu/webgl"]

[dependencies]
runtime = { path = "../runtime" }
render = { path = "../render" }
game = { path = "../game" }
world = { path = "../world" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.80"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = "25.0.0"
