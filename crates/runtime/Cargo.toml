[package]
name = "runtime"
version.workspace = true
edition.workspace = true
description = "Session glue: fixed-step race, chase camera, particles, HUD; native screenshot and bench tools."

[dependencies]
game = { path = "../game" }
render = { path = "../render" }
sim = { path = "../sim" }
glam.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native tools only (offscreen screenshots and the frame bench).
wgpu = { version = "25.0.0", default-features = false, features = ["wgsl", "gles", "vulkan", "metal", "dx12"] }
image = { version = "0.25", default-features = false, features = ["png"] }
